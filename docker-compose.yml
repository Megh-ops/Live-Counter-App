version: '3.8'

services:
  live-counter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-counter-app
    restart: always
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - counter-data:/app/backend/data

volumes:
  counter-data:

